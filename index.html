<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Παιχνίδια Φυσικής 2009</title>
<style>
  :root{
    --bg:#FFFF80; --bar:#0000FF; --ok:#008000; --err:#FF0000;
    --panel:#fffffa; --ink:#000; --line:#c9c96a; --soft:#f1f1c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Times New Roman Greek","Times New Roman",serif;font-size:18px;min-height:100vh;display:flex;justify-content:center;padding:14px}
  #app{width:100%;max-width:780px}
  .card{background:var(--panel);border:2px solid var(--bar);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .head{background:var(--bar);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:Arial,sans-serif}
  .head h1{margin:0;font-size:18px;font-weight:bold}
  .timer{font-variant-numeric:tabular-nums;font-weight:bold;font-size:17px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;white-space:nowrap}
  .timer.low{background:var(--err);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  .progress{height:8px;background:#ddd}
  .progress>div{height:100%;background:var(--ok);width:0;transition:width .25s}
  .body{padding:18px 20px 8px}
  .qnum{font-family:Arial,sans-serif;font-size:13px;color:#555;margin-bottom:6px}
  .topic{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;font-style:italic;white-space:pre-line;line-height:1.4;margin:0 0 12px}
  .qimg{display:block;max-width:100%;height:auto;margin:6px auto 14px;border:1px solid #ddd;background:#fff}
  .hint{font-family:Arial,sans-serif;font-size:13px;color:#555;margin:0 0 8px}
  .opts{display:flex;flex-direction:column;gap:6px;margin:0 0 6px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;line-height:1.35}
  .opt:hover{background:var(--soft)}
  .opt input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--bar)}
  .opt.right{border-color:var(--ok);background:#e3f6e3}
  .opt.wrong{border-color:var(--err);background:#fde4e4}
  .opt .tag{margin-left:auto;font-family:Arial,sans-serif;font-size:12px;font-weight:bold;white-space:nowrap;padding-left:8px}
  .opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--err)}
  .locked .opt{cursor:default}
  .locked .opt:hover{background:#fff}
  .locked .opt.right:hover{background:#e3f6e3}
  .match{display:flex;flex-direction:column;gap:8px}
  .mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .mrow .l{font-weight:bold}
  .mrow select{width:100%;font:inherit;font-size:16px;padding:6px;border:1px solid #888;border-radius:4px;background:#fff}
  .mrow.right{border-color:var(--ok);background:#e3f6e3}
  .mrow.wrong{border-color:var(--err);background:#fde4e4}
  .mrow .fix{grid-column:1/-1;font-family:Arial,sans-serif;font-size:13px;color:var(--ok);font-weight:bold}
  @media(max-width:520px){.mrow{grid-template-columns:1fr}}
  .seq{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
  .seq li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:grab;user-select:none}
  .seq li.drag{opacity:.4}
  .seq li.over{border-color:var(--bar);box-shadow:0 0 0 2px rgba(0,0,255,.2)}
  .seq .n{font-family:Arial,sans-serif;font-weight:bold;color:#fff;background:var(--bar);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .seq .t{flex:1}
  .seq .mv{display:flex;gap:4px}
  .seq button{font-size:14px;padding:2px 8px;border:1px solid #888;background:#eee;border-radius:4px;cursor:pointer}
  .seq li.right{border-color:var(--ok);background:#e3f6e3}
  .seq li.wrong{border-color:var(--err);background:#fde4e4}
  .locked .seq li{cursor:default}
  .hotwrap{position:relative;display:block;margin:6px auto 12px;max-width:100%;touch-action:manipulation}
  .hotwrap img{display:block;width:100%;height:auto;border:1px solid #888;cursor:crosshair;background:#fff}
  .locked .hotwrap img{cursor:default}
  .mark{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;border:3px solid var(--err);background:rgba(255,0,0,.15)}
  .mark.good{border-color:var(--ok);background:rgba(0,128,0,.2)}
  .mark.ans{border:3px dashed var(--ok);background:transparent}
  .feedback{font-family:Arial,sans-serif;font-weight:bold;font-size:17px;margin:10px 0 4px;min-height:22px}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--err)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--soft)}
  .actions .grp{display:flex;gap:8px;flex-wrap:wrap}
  button.btn{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;padding:9px 18px;border:0;border-radius:6px;background:var(--bar);color:#fff;cursor:pointer}
  button.btn:hover:not(:disabled){filter:brightness(1.2)}
  button.btn:disabled{background:#aaa;cursor:not-allowed}
  button.btn.sec{background:#fff;color:var(--bar);border:2px solid var(--bar)}
  button.btn.go{background:var(--ok)}
  button.btn.fin{background:#c00}
  .intro .info{white-space:pre-line;font-style:italic;line-height:1.5;margin:0 0 6px}
  .intro .meta{font-family:Arial,sans-serif;font-size:14px;color:#444;margin:10px 0 0}
  .score{text-align:center;padding:6px 0 10px}
  .score .big{font-family:Arial,sans-serif;font-size:44px;font-weight:bold;color:var(--bar)}
  .score .sub{font-family:Arial,sans-serif;font-size:16px;color:#333;margin-top:2px}
  .passmsg{font-family:Arial,sans-serif;font-weight:bold;text-align:center;margin:6px 0}
  .passmsg.ok{color:var(--ok)} .passmsg.bad{color:var(--err)}
  .thanks{text-align:center;font-style:italic;margin:6px 0 14px}
  .rev{display:flex;flex-direction:column;gap:10px;margin:10px 0 14px}
  .ritem{border:1px solid var(--line);border-left:6px solid var(--err);border-radius:6px;background:#fff;padding:10px 12px}
  .ritem.ok{border-left-color:var(--ok)}
  .ritem .rq{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;font-style:italic;white-space:pre-line}
  .ritem .ra{margin-top:6px;font-size:16px;line-height:1.4}
  .ritem .ra b{font-family:Arial,sans-serif;font-size:13px}
  .ritem .st{font-family:Arial,sans-serif;font-size:12px;font-weight:bold;float:right;margin-left:8px}
  .ritem.ok .st{color:var(--ok)} .ritem:not(.ok) .st{color:var(--err)}
  .ritem img{max-width:160px;height:auto;display:block;margin-top:6px;border:1px solid #ddd}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .dlg{background:#fff;border:3px solid var(--bar);border-radius:10px;padding:20px 22px;max-width:420px;width:100%;font-family:Arial,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .dlg p{margin:0 0 16px;font-size:16px;line-height:1.4}
  .dlgbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  noscript{display:block;padding:20px;font-family:Arial}
  @media print{
    body{background:#fff;padding:0}
    .actions,.timer,.progress{display:none!important}
    .card{box-shadow:none;border:1px solid #000}
    .head{background:#fff;color:#000;border-bottom:2px solid #000}
  }
</style>
</head>

<div id="app"><noscript>Απαιτείται JavaScript για να λειτουργήσει το κουίζ.</noscript></div>
<script>
const DATA = {"quiz": {"title": "παιχνίδια φυσικής 2009", "info": "Καλώς ήλθατε στα \"Παιχνίδια Φυσικής 2009\"\n\n\n\nΟι ερωτήσεις είναι διαφόρων ειδών. Προσοχή στις πολλαπλής επιλογής, υπάρχουν δύο ειδών, αυτές με μία επιλογή (κυκλάκι) και αυτές με πολλές επιλογές(τετραγωνάκι).\nΜετά από την απάντηση πρέπει να πατήσετε καταχώρηση(submit).\nΈχετε 20' για να ολοκληρώσετε τις 20 ερωτήσεις.\n\nΚΑΛΗ ΕΠΙΤΥΧΙΑ!", "time": 1200, "passMsg": "Congratulations, you passed.", "failMsg": "You did not pass.", "thanks": "Ευχαριστούμε για τη συμμετοχή!", "rate": 0.0, "items": [{"type": 3, "point": 1.0, "topic": "Αν η Σελήνη ήταν αυτόφωτη, τότε...", "img": "src_0", "iw": 100, "ih": 100, "choices": [{"t": "Δεν θα είχαμε πανσέληνο", "ok": false}, {"t": "Δεν θα είχαμε έκλειψη Ηλίου", "ok": false}, {"t": "Δεν θα είχαμε έκλειψη Σελήνης", "ok": true}, {"t": "Θα είχαμε συνεχώς Πανσέληνο", "ok": true}], "ok": "Σωστό", "bad": "Λάθος"}, {"type": 2, "point": 1.0, "topic": "Είναι γνωστό ότι μεγάλο μέρος της ηλεκτρικής ενέργειας στην Ελλάδα παράγεται στην περιοχή της Κοζάνης από την καύση των γαιανθράκων. Ποια είναι η σειρά των ενεργειακών μετατροπών από τη στιγμή που θα καεί ο γαιάνθρακας μέχρι να λειτουργήσει ο θερμοσίφωνας στο σπίτι μας;", "img": "src_1", "iw": 468, "ih": 255, "choices": [{"t": "χημική-θερμική-κινητική-ηλεκτρική-θερμική", "ok": true}, {"t": "θερμική-ηλεκτρική-κινητική-θερμική-χημική", "ok": false}, {"t": "ηλεκτρική-χημική-κινητικη-ηλεκτρική-θερμική", "ok": false}, {"t": "χημική-κινητική-θερμική-ηλεκτρική-θερμική", "ok": false}], "ok": "Σωστό", "bad": "Λάθος"}, {"type": 2, "point": 1.0, "topic": "'Οταν ρίξουμε ένα μικρό κομμάτι νατρίου στο νερό παρατηρούμε μια έντονη αντίδραση με ανάφλεξη.Επίσης αν είχαμε προσθέσει λίγες σταγόνες δείκτη φαινολοφθαλεϊνης τότε το νερό θα είχε χρωματιστεί κόκκινο.Αυτό συμβαίνει γιατί:", "img": "src_2", "iw": 280, "ih": 207, "choices": [{"t": "Παράγεται οξυγόνο και οξύ", "ok": false}, {"t": "Παράγεται υδρογόνο και οξύ", "ok": false}, {"t": "Παράγεται οξυγόνο και βάση", "ok": false}, {"t": "Παράγεται υδρογόνο και βάση", "ok": true}], "ok": "Σωστό", "bad": "Λάθος"}, {"type": 5, "point": 1.0, "topic": "Να αντιστοίχισετε τους επιστήμονες της αριστερής στήλης με το πείραμα ή το πεδίο της Φυσικής με το οποίο ασχολήθηκαν της δεξιάς στήλης:", "pairs": [{"l": "Newton", "r": "Νόμος της Αδράνειας"}, {"l": "Coulomb", "r": "Υπολογισμός της ηλεκτροστατικής δύναμης"}, {"l": "Toricelli", "r": "Υπολογισμός της Ατμοσφαιρικής Πίεσης"}, {"l": "Ohm", "r": "Μελέτη της αναλογίας τάσης - ρέυματος σε κάποια είδη αγωγών"}, {"l": "Αρχιμήδης", "r": "Μελέτη και υπολογισμός της Ανωσης"}, {"l": "Pascal", "r": "Μετάδοση εξωτερικής Πίεσης σε υγρά"}], "ok": "Σωστό", "bad": "Λάθος"}, {"type": 8, "point": 1.0, "topic": "Εντοπίστε στον παρακάτω χάρτη την Ελβετία.", "hot": {"img": "hospot_5", "w": 369, "h": 300, "x": 206, "y": 129, "r": 10}, "ok": "Σωστό", "bad": "Λάθος"}, {"type": 6, "point": 1.0, "topic": "Τοποθετήστε στη σωστή σειρά,ξεκινώντας από το απλούστερο προς το πιο σύνθετο,τα εξής σωματίδια:μόριο, πυρήνας, πρωτόνιο, άτομο", "img": "src_5", "iw": 71, "ih": 78, "seq": ["πρωτόνιο", "πυρήνας", "άτομο", "μόριο"], "ok": "Σωστό", "bad": "Λάθος"}, {"type": 5, "point": 1.0, "topic": "Να αντιστοιχίσετε το περιβαλλοντικό πρόβλημα της αριστερής στήλης με τις αντίστοιχες ενώσεις της δεξιάς στήλης που προκαλούν το πρόβλημα αυτό.", "pairs": [{"l": "Ένταση του φαινομένου του θερμοκηπίου", "r": "Διοξείδιο του άνθρακα"}, {"l": "Εξασθένιση της στοιβάδας του όζοντος", "r": "Χλωροφθοράνθρακες"}, {"l": "Όξινη βροχή", "r": "Διοξείδιο του θείου"}, {"l": "Φωτοχημικό νέφος", "r": "Μονοξείδιο του άνθρακα"}], "ok": "Σωστό", "bad": "Λάθος"}, {"type": 2, "point": 1.0, "topic": "Η σειρά(αλληλουχία) των βάσεων σ'ενα τμήμα του μορίου του DNA είναι η εξής:  AGCCTAATC. Ποια θα είναι η αντίστοιχη αλληλουχία  στο μόριο του mRNA;", "img": "src_7", "iw": 200, "ih": 58, "choices": [{"t": "TCGGATTAG", "ok": false}, {"t": "UGCCUAAUC", "ok": false}, {"t": "UCGGUAAUC", "ok": fal <script>
(function(){
"use strict";
const Q = DATA.quiz, IMG = DATA.imgs;
const $app = document.getElementById('app');
let S = null;       // run state
let tick = null;

const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const sameSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));

/* ---------- run state ---------- */
function newRun(){
  const order = shuffle(Q.items.map((_,i)=>i));
  const per = {};
  Q.items.forEach((q,i)=>{
    const p = { done:false, ok:false, ans:null };
    if (q.type===5) p.rightCol = shuffle(q.pairs.map(x=>x.r));
    if (q.type===6) { let o; do { o = shuffle(q.seq.map((_,k)=>k)); } while (q.seq.length>1 && o.every((v,k)=>v===k)); p.ans = o; }
    if (q.type===5) p.ans = q.pairs.map(()=>'');
    if (q.type===2 || q.type===3) p.ans = [];
    per[i] = p;
  });
  return { order, per, cur:0, t0:Date.now(), left:Q.time, finished:false };
}

function startTimer(){
  clearInterval(tick);
  tick = setInterval(()=>{
    if (!S || S.finished) return;
    S.left = Q.time - Math.floor((Date.now()-S.t0)/1000);
    const t = document.getElementById('timer');
    if (t){ t.textContent = '⏱ '+fmt(S.left); t.classList.toggle('low', S.left<=60); }
    if (S.left<=0){ finish(true); }
  },250);
}

/* ---------- screens ---------- */
function header(showTimer){
  return el('div',{class:'head'},
    el('h1',{text:Q.title}),
    showTimer ? el('span',{class:'timer',id:'timer',text:'⏱ '+fmt(S.left)}) : null);
}

function intro(){
  clearInterval(tick); S = null;
  $app.replaceChildren(el('div',{class:'card intro'},
    header(false),
    el('div',{class:'body'},
      el('p',{class:'info',text:Q.info}),
      el('p',{class:'meta',text:Q.items.length+' ερωτήσεις · διάρκεια '+Math.round(Q.time/60)+' λεπτά'})),
    el('div',{class:'actions'},
      el('span'),
      el('button',{class:'btn go',onclick:begin,text:'Έναρξη'}))));
}

function begin(){ S = newRun(); startTimer(); show(); }

function show(){
  const idx = S.order[S.cur], q = Q.items[idx], p = S.per[idx];
  const total = S.order.length, answered = Object.values(S.per).filter(x=>x.done).length;
  const locked = p.done;

  const area = el('div',{class:'area'+(locked?' locked':'')});
  const fb = el('div',{class:'feedback'});
  let submitBtn;

  const body = el('div',{class:'body'},
    el('div',{class:'qnum',text:'Ερώτηση '+(S.cur+1)+' από '+total+' · απαντήθηκαν '+answered}),
    el('p',{class:'topic',text:q.topic}));
  if (q.img) body.append(el('img',{class:'qimg',src:IMG[q.img],alt:'',width:q.iw,height:q.ih}));
  body.append(area, fb);

  const updateSubmit = () => { if (submitBtn) submitBtn.disabled = locked || !ready(q,p); };

  if (q.type===2 || q.type===3) buildChoice(q,p,area,locked,updateSubmit);
  else if (q.type===5) buildMatch(q,p,area,locked,updateSubmit);
  else if (q.type===6) buildSeq(q,p,area,locked,updateSubmit);
  else if (q.type===8) buildHot(q,p,area,locked,updateSubmit);

  if (locked) showFeedback(fb,q,p);

  submitBtn = el('button',{class:'btn go',text:'Καταχώρηση',onclick:()=>{
    p.done = true; p.ok = grade(q,p); show();
  }});
  const prev = el('button',{class:'btn sec',text:'◀ Προηγούμενη',disabled:S.cur===0,onclick:()=>{S.cur--;show();}});
  const next = el('button',{class:'btn sec',text:'Επόμενη ▶',disabled:S.cur===total-1,onclick:()=>{S.cur++;show();}});
  const fin  = el('button',{class:'btn fin',text:'Τέλος',onclick:()=>{
    const left = total-answered;
    if (left>0) askFinish(left); else finish(false);
  }});

  $app.replaceChildren(el('div',{class:'card'},
    header(true),
    el('div',{class:'progress'},el('div',{style:'width:'+Math.round(answered/total*100)+'%'})),
    body,
    el('div',{class:'actions'},
      el('div',{class:'grp'},prev,next),
      el('div',{class:'grp'},locked?null:submitBtn,fin))));
  updateSubmit();
  const t = document.getElementById('timer'); if (t) t.classList.toggle('low', S.left<=60);
  window.scrollTo({top:0});
}

function ready(q,p){
  if (q.type===2 || q.type===3) return p.ans.length>0;
  if (q.type===5) return p.ans.every(v=>v!=='');
  if (q.type===8) return !!p.click;
  return true;
}

function grade(q,p){
  if (q.type===2 || q.type===3){
    const right = q.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0);
    return sameSet(p.ans,right);
  }
  if (q.type===5) return q.pairs.every((pr,i)=>p.ans[i]===pr.r);
  if (q.type===6) return p.ans.every((v,k)=>v===k);
  if (q.type===8){ const h=q.hot,c=p.click; return !!c && Math.hypot(c.x-h.x,c.y-h.y)<=h.r+2; }
  return false;
}

function showFeedback(fb,q,p){
  fb.className = 'feedback '+(p.ok?'ok':'bad');
  fb.textContent = (p.ok?'✔ ':'✘ ')+(p.ok?q.ok:q.bad);
}

/* ---------- question types ---------- */
function buildChoice(q,p,area,locked,upd){
  const multi = q.type===3;
  area.append(el('p',{class:'hint',text:multi?'Επιλέξτε μία ή περισσότερες απαντήσεις (τετράγωνα).':'Επιλέξτε μία απάντηση (κύκλος).'}));
  const wrap = el('div',{class:'opts'});
  q.choices.forEach((c,i)=>{
    const input = el('input',{type:multi?'checkbox':'radio',name:'opt',disabled:locked});
    input.checked = p.ans.includes(i);
    input.addEventListener('change',()=>{
      if (multi) p.ans = input.checked ? [...p.ans,i] : p.ans.filter(x=>x!==i);
      else p.ans = [i];
      upd();
    });
    const row = el('label',{class:'opt'},input,el('span',{text:c.t}));
    if (locked){
      const sel = p.ans.includes(i);
      if (c.ok){ row.classList.add('right'); row.append(el('span',{class:'tag',text:'✔ σωστό'})); }
      else if (sel){ row.classList.add('wrong'); row.append(el('span',{class:'tag',text:'✘ λάθος'})); }
    }
    wrap.append(row);
  });
  area.append(wrap);
}

function buildMatch(q,p,area,locked,upd){
  area.append(el('p',{class:'hint',text:'Αντιστοιχίστε κάθε στοιχείο της αριστερής στήλης με ένα της δεξιάς.'}));
  const wrap = el('div',{class:'match'});
  q.pairs.forEach((pr,i)=>{
    const sel = el('select',{disabled:locked},
      el('option',{value:'',text:'— επιλέξτε —'}),
      ...p.rightCol.map(r=>el('option',{value:r,text:r})));
    sel.value = p.ans[i];
    sel.addEventListener('change',()=>{ p.ans[i]=sel.value; upd(); });
    const row = el('div',{class:'mrow'},el('div',{class:'l',text:pr.l}),sel);
    if (locked){
      const good = p.ans[i]===pr.r;
      row.classList.add(good?'right':'wrong');
      if (!good) row.append(el('div',{class:'fix',text:'Σωστή αντιστοίχιση: '+pr.r}));
    }
    wrap.append(row);
  });
  area.append(wrap);
}

function buildSeq(q,p,area,locked,upd){
  area.append(el('p',{class:'hint',text:locked?'':'Σύρετε τα στοιχεία ή χρησιμοποιήστε τα βέλη για να τα βάλετε στη σωστή σειρά.'}));
  const list = el('ol',{class:'seq'});
  let dragFrom = null;
  const render = () => {
    list.replaceChildren();
    p.ans.forEach((k,pos)=>{
      const li = el('li',{draggable:!locked},
        el('span',{class:'n',text:pos+1}),
        el('span',{class:'t',text:q.seq[k]}));
      if (locked){
        const good = k===pos; li.classList.add(good?'right':'wrong');
        if (!good) li.append(el('span',{class:'tag',style:'font:bold 12px Arial;color:#080',text:'σωστό: '+q.seq[pos]}));
      } else {
        li.append(el('span',{class:'mv'},
          el('button',{type:'button',text:'▲',disabled:pos===0,onclick:()=>{[p.ans[pos-1],p.ans[pos]]=[p.ans[pos],p.ans[pos-1]];render();}}),
          el('button',{type:'button',text:'▼',disabled:pos===p.ans.length-1,onclick:()=>{[p.ans[pos+1],p.ans[pos]]=[p.ans[pos],p.ans[pos+1]];render();}})));
        li.addEventListener('dragstart',e=>{dragFrom=pos;li.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(pos));});
        li.addEventListener('dragend',()=>{li.classList.remove('drag');});
        li.addEventListener('dragover',e=>{e.preventDefault();li.classList.add('over');});
        li.addEventListener('dragleave',()=>li.classList.remove('over'));
        li.addEventListener('drop',e=>{e.preventDefault();if(dragFrom===null||dragFrom===pos)return;const [m]=p.ans.splice(dragFrom,1);p.ans.splice(pos,0,m);dragFrom=null;render();});
      }
      list.append(li);
    });
    upd();
  };
  area.append(list); render();
}

function buildHot(q,p,area,locked,upd){
  const h = q.hot;
  area.append(el('p',{class:'hint',text:locked?'':'Κάντε κλικ στη θέση που νομίζετε ότι είναι σωστή και μετά πατήστε «Καταχώρηση».'}));
  const wrap = el('div',{class:'hotwrap',style:'width:'+h.w+'px'});
  const img = el('img',{src:IMG[h.img],alt:'Χάρτης',draggable:'false'});
  wrap.append(img); area.append(wrap);
  const pct = (x,y,r) => `left:${x/h.w*100}%;top:${y/h.h*100}%;width:${2*r/h.w*100}%;height:${2*r/h.h*100}%`;
  const draw = () => {
    wrap.querySelectorAll('.mark').forEach(m=>m.remove());
    if (p.click) wrap.append(el('div',{class:'mark'+(locked&&p.ok?' good':''),style:pct(p.click.x,p.click.y,9)}));
    if (locked && !p.ok) wrap.append(el('div',{class:'mark ans',style:pct(h.x,h.y,h.r+4)}));
  };
  if (!locked) img.addEventListener('click',e=>{
    const r = img.getBoundingClientRect();
    p.click = { x:(e.clientX-r.left)/r.width*h.w, y:(e.clientY-r.top)/r.height*h.h };
    draw(); upd();
  });
  draw();
}

/* ---------- in-page confirmation (no window.confirm: it is blocked in many embedded views) ---------- */
function askFinish(left){
  const close = () => { const m=document.getElementById('modal'); if (m) m.remove(); };
  close();
  const word = left===1 ? 'αναπάντητη ερώτηση' : 'αναπάντητες ερωτήσεις';
  document.body.append(el('div',{id:'modal',class:'modal',onclick:e=>{ if (e.target.id==='modal') close(); }},
    el('div',{class:'dlg',role:'dialog','aria-modal':'true'},
      el('p',{text:'Υπάρχουν '+left+' '+word+'. Θέλετε σίγουρα να τελειώσετε;'}),
      el('div',{class:'dlgbtns'},
        el('button',{class:'btn sec',text:'Συνέχεια κουίζ',onclick:close}),
        el('button',{class:'btn fin',text:'Ναι, τέλος',onclick:()=>{ close(); finish(false); }})))));
}

/* ---------- results ---------- */
function answerText(q,p,idx){
  if (q.type===2 || q.type===3) return q.choices.filter(c=>c.ok).map(c=>c.t).join(' · ');
  if (q.type===5) return q.pairs.map(x=>x.l+' → '+x.r).join(' · ');
  if (q.type===6) return q.seq.map((s,i)=>(i+1)+'. '+s).join('  ');
  if (q.type===8) return 'Η Ελβετία (σημειώνεται στον χάρτη της ερώτησης).';
  return '';
}

function finish(timeUp){
  if (!S || S.finished) return;
  S.finished = true; clearInterval(tick);
  const m0=document.getElementById('modal'); if (m0) m0.remove();
  const used = Math.min(Q.time, Math.floor((Date.now()-S.t0)/1000));
  let pts=0, max=0;
  S.order.forEach(i=>{ const q=Q.items[i]; max+=q.point; if (S.per[i].done && S.per[i].ok) pts+=q.point; });
  const pct = max? pts/max*100 : 0;
  const passed = pct >= Q.rate;

  const rev = el('div',{class:'rev'});
  S.order.forEach((i,n)=>{
    const q=Q.items[i], p=S.per[i];
    const it = el('div',{class:'ritem'+(p.done&&p.ok?' ok':'')},
      el('span',{class:'st',text:!p.done?'ΑΝΑΠΑΝΤΗΤΗ':p.ok?'✔ ΣΩΣΤΗ':'✘ ΛΑΘΟΣ'}),
      el('div',{class:'rq',text:(n+1)+'. '+q.topic}),
      el('div',{class:'ra'},el('b',{text:'Σωστή απάντηση: '}),answerText(q,p,i)));
    rev.append(it);
  });

  $app.replaceChildren(el('div',{class:'card'},
    el('div',{class:'head'},el('h1',{text:Q.title+' — Αποτελέσματα'})),
    el('div',{class:'body'},
      timeUp ? el('p',{class:'passmsg bad',text:'Ο χρόνος σας τελείωσε!'}) : null,
      el('div',{class:'score'},
        el('div',{class:'big',text:pts+' / '+max}),
        el('div',{class:'sub',text:Math.round(pct)+'% · χρόνος: '+fmt(used)+' από '+fmt(Q.time)})),
      el('p',{class:'passmsg '+(passed?'ok':'bad'),text:passed?Q.passMsg:Q.failMsg}),
      el('p',{class:'thanks',text:Q.thanks}),
      el('h2',{style:'font:bold 16px Arial;margin:14px 0 4px',text:'Αναλυτικά οι απαντήσεις'}),
      rev),
    el('div',{class:'actions'},
      el('button',{class:'btn sec',text:'🖨 Εκτύπωση',onclick:()=>window.print()}),
      el('button',{class:'btn go',text:'Νέα προσπάθεια',onclick:intro}))));
  window.scrollTo({top:0});
}

intro();
})();
</script>
